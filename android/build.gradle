// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Pin some Android/NDK versions to avoid picking an incompatible NDK from the SDK.
ext {
  // NDK 27.x is required here so the C++ toolchain used by React Native can build
  // code that relies on std::format during release CMake compilation on Windows.
  ndkVersion = "27.1.12297006"
  buildToolsVersion = "35.0.0"
  compileSdkVersion = 35
  minSdkVersion = 24
  targetSdkVersion = 35
}

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  // Ensure newArchEnabled is propagated to all subprojects
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
        project.android {
            defaultConfig {
                externalNativeBuild {
                    cmake {
                    arguments "-DCMAKE_ANDROID_STL_TYPE=c++_shared", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_SHARED_LINKER_FLAGS=-lc++_shared"
                    }
                }
            }
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
        }
    }
    if (!project.hasProperty("newArchEnabled")) {
      project.ext.set("newArchEnabled", "true")
    }
  }

  // Disable lintVital tasks to avoid file lock issues on Windows
  tasks.whenTaskAdded { task ->
    if (task.name.startsWith("lintVital")) {
      task.enabled = false
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
